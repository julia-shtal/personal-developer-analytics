name: CI

# Run on pushes to the main lines of development, and on every PR targeting them.
on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]

# Cancel superseded runs on the same ref to save minutes and give faster feedback.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least-privilege default: the workflow only needs to read the repo.
permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------------
  # Backend: build + test against a real PostgreSQL 16 service container.
  # ---------------------------------------------------------------------------
  backend:
    name: Backend (build + test)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: dev_analytics
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        # Wait until Postgres is genuinely ready before tests start.
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 17 (Temurin) with Maven cache
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Run backend tests
        working-directory: dev-analytics
        env:
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/dev_analytics
          SPRING_DATASOURCE_USERNAME: postgres
          SPRING_DATASOURCE_PASSWORD: postgres
        run: ./mvnw --batch-mode --no-transfer-progress verify

  # ---------------------------------------------------------------------------
  # Frontend: lint + unit tests. No database needed.
  # Test comment here.
  # ---------------------------------------------------------------------------
  frontend:
    name: Frontend (lint + test)
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node 20 with npm cache
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: dev-analytics/frontend/package-lock.json

      - name: Install dependencies (clean, from lockfile)
        working-directory: dev-analytics/frontend
        run: npm ci

      - name: Lint
        working-directory: dev-analytics/frontend
        run: npm run lint

      - name: Run tests
        working-directory: dev-analytics/frontend
        run: npm run test:run