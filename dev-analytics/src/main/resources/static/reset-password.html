<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Reset Password – Dev Analytics</title>
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #f0f2f5;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .card {
            background: #fff;
            border-radius: 12px;
            box-shadow: 0 4px 24px rgba(0, 0, 0, .08);
            padding: 40px 36px;
            width: 100%;
            max-width: 380px;
        }

        h1 {
            font-size: 22px;
            font-weight: 600;
            color: #1a1a1a;
            margin-bottom: 8px;
        }

        .subtitle {
            font-size: 14px;
            color: #6b7280;
            margin-bottom: 28px;
        }

        label {
            display: block;
            font-size: 13px;
            font-weight: 500;
            color: #374151;
            margin-bottom: 6px;
        }

        input[type="password"] {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            font-size: 14px;
            outline: none;
            transition: border-color .15s;
            margin-bottom: 20px;
        }

        input[type="password"]:focus { border-color: #3b82f6; }

        button {
            width: 100%;
            padding: 11px;
            background: #3b82f6;
            color: #fff;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: background .15s;
        }

        button:hover:not(:disabled) { background: #2563eb; }
        button:disabled { background: #93c5fd; cursor: not-allowed; }

        .message {
            margin-top: 16px;
            font-size: 13px;
            padding: 10px 12px;
            border-radius: 8px;
            display: none;
        }

        .message.success { background: #ecfdf5; color: #065f46; display: block; }
        .message.error   { background: #fef2f2; color: #991b1b; display: block; }

        .invalid-token {
            text-align: center;
            color: #6b7280;
            font-size: 14px;
        }
    </style>
</head>
<body>
<div class="card" id="card">
    <h1>Set new password</h1>
    <p class="subtitle">Enter a new password for your account.</p>

    <form id="form">
        <label for="pw">New password</label>
        <input type="password" id="pw" placeholder="At least 8 characters" minlength="8" required/>

        <label for="pw2">Confirm password</label>
        <input type="password" id="pw2" placeholder="Repeat password" minlength="8" required/>

        <button type="submit" id="btn">Reset password</button>
    </form>

    <div class="message" id="msg"></div>
</div>

<script>
    const params = new URLSearchParams(window.location.search);
    const token  = params.get('token');

    if (!token) {
        document.getElementById('card').innerHTML =
            '<p class="invalid-token">Invalid or missing reset token.</p>';
    }

    document.getElementById('form')?.addEventListener('submit', async e => {
        e.preventDefault();

        const pw   = document.getElementById('pw').value;
        const pw2  = document.getElementById('pw2').value;
        const msg  = document.getElementById('msg');
        const btn  = document.getElementById('btn');

        msg.className = 'message';
        msg.textContent = '';

        if (pw !== pw2) {
            msg.className = 'message error';
            msg.textContent = 'Passwords do not match.';
            return;
        }

        btn.disabled = true;
        btn.textContent = 'Resetting…';

        try {
            const res = await fetch('/api/auth/reset-password', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ token, newPassword: pw })
            });

            if (res.ok) {
                msg.className = 'message success';
                msg.textContent = 'Password updated successfully. You can now log in.';
                document.getElementById('form').remove();
            } else {
                const body = await res.json().catch(() => ({}));
                msg.className = 'message error';
                msg.textContent = body.message || 'Something went wrong. The link may have expired.';
                btn.disabled = false;
                btn.textContent = 'Reset password';
            }
        } catch {
            msg.className = 'message error';
            msg.textContent = 'Network error. Please try again.';
            btn.disabled = false;
            btn.textContent = 'Reset password';
        }
    });
</script>
</body>
</html>
