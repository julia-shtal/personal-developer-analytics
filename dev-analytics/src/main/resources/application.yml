spring:
  datasource:
    url:
    username:
    password:
  flyway:
    enabled: true
    locations: classpath:db/migration
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        jdbc:
          batch_size: 500
        order_inserts: true
        order_updates: true
  mail:
    host: ${SMTP_HOST:smtp.gmail.com}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

app:
  jwt:
    secret: ${JWT_SECRET:3069dca7dcfb855b274fe98bab084cf4879927e3edcf440004ec76f029d560f5}
    access-expiration: 900000      # 15 minutes
    refresh-expiration: 604800000  # 7 days
  password-reset:
    expiration: 3600000            # 1 hour
  base-url: ${APP_BASE_URL:http://localhost:8080}

ai:
  ollama:
    base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
    model: ${OLLAMA_MODEL:llama3.2}
    num-predict: ${OLLAMA_NUM_PREDICT:1024}
    seed: ${OLLAMA_SEED:42}

server:
  port: 8080

logging:
  # Fine-grained levels are managed in logback-spring.xml.
  # Override log path via LOG_PATH env var (default: logs/).
  level:
    root: INFO
