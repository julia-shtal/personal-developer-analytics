spring:
  servlet:
    multipart:
      max-file-size: 2MB
      max-request-size: 2MB
  datasource:
    url: ${SPRING_DATASOURCE_URL:}
    username: ${SPRING_DATASOURCE_USERNAME:}
    password: ${SPRING_DATASOURCE_PASSWORD:}
  flyway:
    repair-on-migrate: true  # Spring Boot 3.x property
    enabled: true
    locations: classpath:db/migration
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        jdbc:
          batch_size: 500
        order_inserts: true
        order_updates: true
  mail:
    host: ${SMTP_HOST:smtp.gmail.com}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

app:
  jwt:
    secret: ${JWT_SECRET:}
    access-expiration: 900000      # 15 minutes
    refresh-expiration: 604800000  # 7 days
  password-reset:
    expiration: 3600000            # 1 hour
  base-url: ${APP_BASE_URL:http://localhost:8080}
  encryption:
    # 32-byte AES-256 key, base64-encoded. Generate: openssl rand -base64 32
    key: ${ENCRYPTION_KEY:}
    # Set ENCRYPTION_MIGRATE=true once to re-encrypt legacy tokens, then revert
    migrate-on-startup: ${ENCRYPTION_MIGRATE:false}
  rate-limit:
    default-rpm: ${RATE_LIMIT_DEFAULT_RPM:120}
    ai-rpm: ${RATE_LIMIT_AI_RPM:10}
  cookie:
    secure: ${COOKIE_SECURE:false}

ai:
  ollama:
    base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
    model: ${OLLAMA_MODEL:llama3.2}
    num-predict: ${OLLAMA_NUM_PREDICT:1024}
    seed: ${OLLAMA_SEED:42}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-components: always
      show-details: when-authorized

server:
  port: 8080

logging:
  # Fine-grained levels are managed in logback-spring.xml.
  # Override log path via LOG_PATH env var (default: logs/).
  level:
    root: INFO
