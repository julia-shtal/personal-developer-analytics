spring:
  task:
    scheduling:
      pool:
        # Enough for the 2-minute enrichment pass to overrun without delaying the three
        # nightly crons, which fire an hour apart. The default of 1 queues them behind it.
        size: ${SCHEDULING_POOL_SIZE:4}
  servlet:
    multipart:
      max-file-size: 2MB
      max-request-size: 2MB
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/dev_analytics}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:}
  flyway:
    enabled: true
    locations: classpath:db/migration
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        jdbc:
          batch_size: 500
        order_inserts: true
        order_updates: true
  mail:
    host: ${SMTP_HOST:localhost}
    port: ${SMTP_PORT:1025}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${SMTP_AUTH:false}
          starttls:
            enable: ${SMTP_STARTTLS:false}

app:
  # Filtered from the Maven build at package time (see resource filtering in the parent POM).
  version: @project.version@
  jwt:
    secret: ${JWT_SECRET:}
    access-expiration: 900000      # 15 minutes
    refresh-expiration: 604800000  # 7 days
  password-reset:
    expiration: 3600000            # 1 hour
  http:
    # Bounds one outbound hop on the shared RestTemplate (Jira discovery and collection).
    connect-timeout-ms: ${HTTP_CONNECT_TIMEOUT_MS:5000}
    read-timeout-ms: ${HTTP_READ_TIMEOUT_MS:30000}
  cors:
    # Dev origins: the packaged SPA on :8080 and the Vite dev server on :5173.
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:8080,http://localhost:5173}
  base-url: ${APP_BASE_URL:http://localhost:8080}
  frontend-url: ${APP_FRONTEND_URL:http://localhost:5173}
  encryption:
    # 32-byte AES-256 key, base64-encoded. Generate: openssl rand -base64 32
    key: ${ENCRYPTION_KEY:}
    # Set ENCRYPTION_MIGRATE=true once to re-encrypt legacy tokens, then revert
    migrate-on-startup: ${ENCRYPTION_MIGRATE:false}
  rate-limit:
    default-rpm: ${RATE_LIMIT_DEFAULT_RPM:120}
    ai-rpm: ${RATE_LIMIT_AI_RPM:10}
  cookie:
    secure: ${COOKIE_SECURE:false}
  mail:
    from-address: ${MAIL_FROM:noreply@dev-analytics.local}
    from-name: ${MAIL_FROM_NAME:Dev Analytics}
  metrics:
    backfill:
      # Days of imported history one backfill run may compute per user. The cap is a
      # resumable throttle, not truncation: whatever it defers is still missing on the
      # next run. Raise it to fill a long range in fewer scheduled passes.
      max-days-per-run: ${METRICS_BACKFILL_MAX_DAYS_PER_RUN:30}

ai:
  ollama:
    base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
    model: ${OLLAMA_MODEL:llama3.2}
    num-predict: ${OLLAMA_NUM_PREDICT:1024}
    seed: ${OLLAMA_SEED:42}
    num-thread: ${OLLAMA_NUM_THREAD:1}
    top-k: ${OLLAMA_TOP_K:1}
    top-p: ${OLLAMA_TOP_P:0.0}
    repeat-penalty: ${OLLAMA_REPEAT_PENALTY:1.0}
    num-ctx: ${OLLAMA_NUM_CTX:8192}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-components: always
      show-details: when-authorized

server:
  port: 8080

logging:
  # Fine-grained levels are managed in logback-spring.xml.
  # Override log path via LOG_PATH env var (default: logs/).
  level:
    root: INFO

jira:
  default-jql: ${JIRA_DEFAULT_JQL:assignee = currentUser() ORDER BY created DESC}
  page-size: ${JIRA_PAGE_SIZE:100}
