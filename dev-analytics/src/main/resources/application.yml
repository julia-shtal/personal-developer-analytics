spring:
  datasource:
    url:
    username:
    password:
  flyway:
    enabled: true
    locations: classpath:db/migration
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
  mail:
    host: ${SMTP_HOST:smtp.gmail.com}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

app:
  jwt:
    secret: ${JWT_SECRET:3069dca7dcfb855b274fe98bab084cf4879927e3edcf440004ec76f029d560f5}
    access-expiration: 900000      # 15 minutes
    refresh-expiration: 604800000  # 7 days
  password-reset:
    expiration: 3600000            # 1 hour
  base-url: ${APP_BASE_URL:http://localhost:8080}

server:
  port: 8080

logging:
  level:
    com.juliashtal: DEBUG
